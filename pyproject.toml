[project]
name = "diffly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "izume01" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "httpx-oauth>=0.17.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.43.0",
    "pydantic-ai-harness>=0.31.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.4",
    "valkey>=6.1.1",
]

[project.scripts]
diffly = "diffly:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportCallInDefaultInitializer = false
reportUnusedCallResult = false

[tool.ruff.lint]
ignore = ["B008"]

